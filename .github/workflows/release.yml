name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Tag matches the gem version
        run: test "${GITHUB_REF_NAME}" = "v$(ruby -Ilib -rrails_refdocs/version -e 'print RailsRefdocs::VERSION')"
      - run: bundle exec rake test
      - uses: rubygems/release-gem@v1
